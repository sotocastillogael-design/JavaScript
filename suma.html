   <h1>Suma</h1>
   <script>
    let N1=Number(prompt("introduce el primer numero"));
    let N2=Number(prompt("introduce el segundo numero"));
    suma=N1+N2,
    document.write ("el valor de tu suma es: " + suma + "<br>");
    resta=N1-N2;
    document.write ("el valor de tu resta es: " + resta + "<br>");
    multiplicacion=N1*N2;
    document.write ("el valor de tu multiplicacion es: " + multiplicacion + "<br>");
    division=N1/N2;
    document.write ("el valor division es: " + division);
   </script>
